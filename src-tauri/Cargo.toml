[package]
name = "finanzarchiv2"
version = "0.1.0"
description = "Finanzarchiv 2.0, der Kern"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
# The library holds the core, so tests and later tools reach it without the window.
name = "finanzarchiv2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
jiff = "=1.0.3"
thiserror = "=2.0.21"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"

[dev-dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
