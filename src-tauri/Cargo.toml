[package]
name = "finanzarchiv2"
description = "Finanzarchiv 2.0, der Kern"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
# The library holds the core, so tests and later tools reach it without the window.
name = "finanzarchiv2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
jiff = "=1.0.3"
thiserror = "=2.0.21"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
pdfium-render = "=0.9.6"
sha2 = "=0.11.2"
tauri-plugin-dialog = "=2.8.4"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "=0.23.1"
regex = "=1.13.2"
quick-xml = "=0.42.0"
ureq = { version = "=3.5.2", default-features = false, features = ["json"] }
notify = "=9.0.0"

[dev-dependencies]
lopdf = "=0.47.0"
proptest = "=1.12.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The generated corpus and the measure command of #09. Examples, so they are never part of the app.
[[example]]
name = "corpus"
test = true

[[example]]
name = "measure"
